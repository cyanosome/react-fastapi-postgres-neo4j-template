services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    networks:
      - edge-net
      - internal-db-net
    env_file:
      - path: .env
        required: false
    command: ["uv", "run", "fastapi", "run", "main.py", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-net"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-app.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.middlewares=backend-stripprefix"
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    networks:
      - edge-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-net"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-app.localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

networks:
  edge-net:
    name: edge-net
    external: true
  internal-db-net:
    name: internal-db-net
    external: true
